<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .paper{fill:#fff}.ink{fill:#000}.frame{stroke:#000}
    @media (prefers-color-scheme: dark){.paper{fill:#000}.ink{fill:#fff}.frame{stroke:#fff}}
  </style>
  <rect class="paper" width="32" height="32"/>
  <rect class="frame" x="2" y="2" width="28" height="28" fill="none" stroke-width="4"/>
  <rect class="ink" x="16" y="7" width="9" height="9"/>
</svg>
