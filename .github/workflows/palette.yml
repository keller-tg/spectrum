# Fails on any colour other than ink and paper, and on the effects the design
# bans with them: opacity, shadows, rounded corners, blur, gradients (D-075).
# See scripts/check-palette.ts.
name: Palette guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  two-colours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install (TypeScript parser only needs node_modules)
        run: npm ci --ignore-scripts
      - name: Ink and paper only
        run: node scripts/check-palette.ts
